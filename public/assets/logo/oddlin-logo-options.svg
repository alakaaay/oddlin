<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <defs>
    <!-- 1. Dial: кольцо «o» как шкала вероятности + отметка сигнала -->
    <g id="icon1">
      <rect width="512" height="512" rx="112" fill="#111318"/>
      <circle cx="256" cy="256" r="120" fill="none" stroke="#FFFFFF" stroke-width="48"/>
      <circle cx="340.85" cy="171.15" r="46" fill="#4C6FFF" stroke="#111318" stroke-width="18"/>
    </g>
    <!-- 2. Calibration: идеальная линия калибровки + точка на ней -->
    <g id="icon2">
      <rect width="512" height="512" rx="112" fill="#111318"/>
      <path d="M120 120 V392 H392" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M144 368 L368 144" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
      <circle cx="292" cy="220" r="42" fill="#4C6FFF"/>
    </g>
    <!-- 3. Edge: цена и fair value, пересечение = edge -->
    <g id="icon3">
      <rect width="512" height="512" rx="112" fill="#111318"/>
      <circle cx="200" cy="256" r="104" fill="none" stroke="#FFFFFF" stroke-width="40"/>
      <circle cx="312" cy="256" r="104" fill="none" stroke="#FFFFFF" stroke-width="40"/>
      <path d="M256 168.4 A104 104 0 0 1 256 343.6 A104 104 0 0 1 256 168.4 Z" fill="#4C6FFF"/>
    </g>
    <!-- Wordmark: моно-линия из окружностей и штрихов, точка над i = сигнал -->
    <g id="wordmark-shapes">
      <circle cx="30" cy="55" r="20" fill="none" stroke-width="10"/>
      <circle cx="92" cy="55" r="20" fill="none" stroke-width="10"/>
      <path d="M112 5 V80" stroke-width="10"/>
      <circle cx="154" cy="55" r="20" fill="none" stroke-width="10"/>
      <path d="M174 5 V80" stroke-width="10"/>
      <path d="M198 5 V80" stroke-width="10"/>
      <path d="M222 30 V80" stroke-width="10"/>
      <path d="M246 80 V55 A20 20 0 0 1 286 55 V80" fill="none" stroke-width="10"/>
    </g>
    <g id="wordmark-dark"><g stroke="#111318"><use href="#wordmark-shapes"/></g><circle cx="222" cy="14" r="7" fill="#4C6FFF"/></g>
    <g id="wordmark-light"><g stroke="#FFFFFF"><use href="#wordmark-shapes"/></g><circle cx="222" cy="14" r="7" fill="#4C6FFF"/></g>
  </defs>

  <rect width="1600" height="1040" fill="#F5F6F8"/>
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" fill="#111318">
    <text x="80" y="104" font-size="44" font-weight="700">Oddlin — logo options</text>
    <text x="80" y="146" font-size="22" fill="#6B7080">Minimal monoline. Ink #111318 · Signal blue #4C6FFF · White</text>

    <use href="#icon1" transform="translate(80 200) scale(0.5)"/>
    <use href="#icon2" transform="translate(460 200) scale(0.5)"/>
    <use href="#icon3" transform="translate(840 200) scale(0.5)"/>
    <text x="80" y="500" font-size="24" font-weight="700">1 · Dial (recommended)</text>
    <text x="80" y="532" font-size="18" fill="#6B7080">“o” of odds as a probability dial</text>
    <text x="460" y="500" font-size="24" font-weight="700">2 · Calibration</text>
    <text x="460" y="532" font-size="18" fill="#6B7080">Perfect calibration — we grade ourselves</text>
    <text x="840" y="500" font-size="24" font-weight="700">3 · Edge</text>
    <text x="840" y="532" font-size="18" fill="#6B7080">Price vs fair value — overlap is the edge</text>

    <!-- small sizes check -->
    <text x="1240" y="232" font-size="18" fill="#6B7080">Small sizes</text>
    <use href="#icon1" transform="translate(1240 256) scale(0.125)"/>
    <use href="#icon1" transform="translate(1320 256) scale(0.0625)"/>
    <use href="#icon1" transform="translate(1370 256) scale(0.03125)"/>
    <use href="#icon2" transform="translate(1240 344) scale(0.125)"/>
    <use href="#icon2" transform="translate(1320 344) scale(0.0625)"/>
    <use href="#icon2" transform="translate(1370 344) scale(0.03125)"/>
    <use href="#icon3" transform="translate(1240 432) scale(0.125)"/>
    <use href="#icon3" transform="translate(1320 432) scale(0.0625)"/>
    <use href="#icon3" transform="translate(1370 432) scale(0.03125)"/>

    <!-- wordmark + lockups -->
    <rect x="80" y="600" width="700" height="360" rx="24" fill="#FFFFFF"/>
    <use href="#wordmark-dark" transform="translate(130 640) scale(2)"/>
    <use href="#icon1" transform="translate(130 840) scale(0.1875)"/>
    <use href="#wordmark-dark" transform="translate(254 838.5) scale(0.9)"/>

    <rect x="820" y="600" width="700" height="360" rx="24" fill="#111318"/>
    <use href="#wordmark-light" transform="translate(870 640) scale(2)"/>
    <g transform="translate(870 840) scale(0.1875)">
      <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
      <circle cx="256" cy="256" r="120" fill="none" stroke="#111318" stroke-width="48"/>
      <circle cx="340.85" cy="171.15" r="46" fill="#4C6FFF" stroke="#FFFFFF" stroke-width="18"/>
    </g>
    <use href="#wordmark-light" transform="translate(994 838.5) scale(0.9)"/>
  </g>
</svg>
