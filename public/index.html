<script>
/* Session id: a random id for this browser tab, sent with every pixel event and with the email signup.
   Kept in sessionStorage, so it survives reloads and resets in a new tab. */
window.oddlinSession = (function () {
  var key = 'oddlin_session', id;
  try { id = sessionStorage.getItem(key); } catch (e) {}
  if (!id) {
    id = 's_' + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    try { sessionStorage.setItem(key, id); } catch (e) {}
  }
  return id;
})();
</script>

n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '1801702574890246');
fbq('track', 'PageView', { session_id: window.oddlinSession });
</script>
