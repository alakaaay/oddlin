<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Oddlin links</title>
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0D11" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/logo/oddlin-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=JetBrains+Mono:wght@500&family=Outfit:wght@600&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/22px var(--f-sans); -webkit-font-smoothing: antialiased; }
  main { max-width: 960px; margin: 0 auto; padding: var(--space-8) var(--space-4) 80px; }
  a { color: inherit; }
  .mono { font-family: var(--f-mono); font-weight: 500; }

  /* hero */
  .logo { display: block; height: 32px; width: auto; }
  .hero { padding: var(--space-12) 0 40px; border-bottom: 1px solid var(--line); margin-bottom: 40px; }
  .hero h1 { font: 600 clamp(44px, 9vw, 80px)/1 var(--f-display); letter-spacing: -0.035em; margin: var(--space-8) 0 var(--space-3); }
  .hero h1 span { color: var(--signal-text); }
  .hero p { color: var(--ink-muted); font-size: 17px; line-height: 26px; margin: 0; max-width: 520px; }

  /* sections */
  section { margin-bottom: 48px; }
  .eyebrow { font: 500 12px/16px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-3); }
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--space-2) var(--space-4); margin-bottom: var(--space-4); }
  .sec-head h2 { font: 600 28px/32px var(--f-display); letter-spacing: -0.02em; margin: 0; display: flex; align-items: center; gap: var(--space-3); }
  .tag { font: 600 12px/16px var(--f-sans); letter-spacing: .02em; padding: 4px 10px; border-radius: var(--r-full); background: var(--signal-soft); color: var(--signal-text); }
  .count { color: var(--ink-muted); font-size: 13px; }

  /* main link cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-4); }
  .card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); transition: border-color .15s; }
  .card:hover { border-color: var(--line-strong); }
  .card .top { display: flex; align-items: center; gap: var(--space-3); }
  .icon { width: 44px; height: 44px; border-radius: var(--r-md); background: var(--signal-soft); display: grid; place-items: center; flex: none; }
  .icon svg { width: 22px; height: 22px; stroke: var(--signal-text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card h3 { font: 600 20px/24px var(--f-display); margin: 0; }
  .card .note { color: var(--ink-muted); font-size: 14px; line-height: 20px; margin: 2px 0 0; }
  .url { font: 500 12px/18px var(--f-mono); color: var(--ink-muted); word-break: break-all; background: var(--ground); border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--space-2) var(--space-3); }
  .row { display: flex; gap: var(--space-2); }
  .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 600 14px/20px var(--f-sans); padding: 10px var(--space-4); border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; transition: background .15s; }
  .btn:hover { background: var(--ground); }
  .btn.primary { background: var(--action); border-color: var(--action); color: var(--on-action); }
  .btn.primary:hover { filter: brightness(1.06); background: var(--action); }
  .btn:focus-visible { outline: none; box-shadow: var(--shadow-focus); }

  /* ad set */
  .adset { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--space-6); }
  .adset + .adset { margin-top: var(--space-4); }
  .ads { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-3); }
  .ad { border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); background: var(--ground); }
  .ad .name { font: 600 16px/20px var(--f-display); }
  .ad .url { background: var(--surface); }
  .ad .url.empty { font-family: var(--f-sans); font-style: italic; }
  .btn[aria-disabled="true"], .btn:disabled { opacity: .45; pointer-events: none; }

  footer { color: var(--ink-muted); font-size: 12px; line-height: 18px; border-top: 1px solid var(--line); padding-top: var(--space-6); }
  @media (max-width: 600px) {
    main { padding: var(--space-6) var(--space-4) 56px; }
    .logo { height: 28px; }
    .hero { padding: var(--space-8) 0 var(--space-8); margin-bottom: var(--space-8); }
    .hero h1 { margin-top: var(--space-6); }
    .hero p { font-size: 16px; line-height: 24px; }
    section { margin-bottom: 40px; }
    .cards, .ads { grid-template-columns: 1fr; }
    .card, .adset { padding: var(--space-4); border-radius: var(--r-md); }
    .sec-head h2 { font-size: 24px; line-height: 28px; }
    .btn { min-height: 44px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <svg class="logo" viewBox="0 0 391 96" role="img" aria-label="Oddlin">
      <g transform="scale(0.1875)"><rect width="512" height="512" rx="112" fill="var(--tile)"/><circle cx="256" cy="256" r="120" fill="none" stroke="var(--tile-ring)" stroke-width="48"/><circle cx="340.85" cy="171.15" r="46" fill="#4C6FFF" stroke="var(--tile)" stroke-width="18"/></g>
      <g transform="translate(124 -1.5) scale(0.9)"><g fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="55" r="20"/><circle cx="92" cy="55" r="20"/><path d="M112 10 V75"/><circle cx="154" cy="55" r="20"/><path d="M174 10 V75"/><path d="M198 10 V75"/><path d="M222 35 V75"/><path d="M246 75 V55 A20 20 0 0 1 286 55 V75"/></g><circle cx="222" cy="14" r="7" fill="#4C6FFF"/></g>
    </svg>
    <div class="hero">
      <h1>Know your <span>odds.</span></h1>
      <p>Learn prediction markets before you put in a dollar. The funnel, the app and our ads, in one place.</p>
    </div>
  </header>

  <section>
    <p class="eyebrow">Product</p>
    <div class="cards" id="product"></div>
  </section>

  <section>
    <p class="eyebrow">Meta ads</p>
    <div id="adsets"></div>
  </section>

  <footer>Information only, not financial advice. Prediction markets involve risk of loss.</footer>
</main>
<script>
  const DOMAIN = 'https://oddlin.vercel.app';

  // Product links: path on the production domain.
  const PRODUCT = [
    { name: 'Funnel', note: 'Quiz, 28-day plan and paywall', path: '/quiz', icon: 'funnel' },
    { name: 'App', note: 'Lessons, Simulator, AI tools', path: '/app', icon: 'app' }
  ];

  // Ad sets. Paste each ad's Meta link into `url` (Ads Manager › ad › Preview › Share).
  // An empty url shows a placeholder. Add or remove rows as ads change.
  const ADSETS = [
    { name: 'Ad set 1', kind: 'Dynamic', ads: [
      { name: 'Ad 1', url: 'https://fb.me/adspreview/facebook/27ilWhzG0exAZXG' },
      { name: 'Ad 2', url: 'https://fb.me/adspreview/facebook/2cqggbcipsB2fFp' },
      { name: 'Ad 3', url: 'https://fb.me/adspreview/facebook/qyu5guoBHPTPAou' }
    ] },
    { name: 'Ad set 2', kind: 'Static', ads: [
      { name: 'Ad 1', url: 'https://fb.me/adspreview/facebook/1XhJ3Mlbxd2mZEa' },
      { name: 'Ad 2', url: 'https://fb.me/adspreview/facebook/1WUoJV3GcaAOt9A' },
      { name: 'Ad 3', url: 'https://fb.me/adspreview/facebook/28YKJV4GP5Czepf' }
    ] }
  ];

  const ICONS = {
    funnel: '<path d="M3 4h18l-7 8v6l-4 2v-8z"/>',
    app: '<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>'
  };
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const text = (tag, cls, t) => { const e = el(tag, cls); e.textContent = t; return e; };
  const link = path => new URL(path, DOMAIN).href;
  function copyBtn(value, label = 'Copy') {
    const b = text('button', 'btn', label); b.type = 'button';
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(value); b.textContent = 'Copied'; } catch (e) { b.textContent = 'Copy failed'; }
      setTimeout(() => { b.textContent = label; }, 1500);
    });
    return b;
  }
  function openBtn(href, label = 'Open', primary) {
    const a = text('a', 'btn' + (primary ? ' primary' : ''), label);
    a.href = href; a.target = '_blank'; a.rel = 'noopener';
    return a;
  }

  const product = document.getElementById('product');
  for (const p of PRODUCT) {
    const href = link(p.path);
    const card = el('div', 'card');
    const top = el('div', 'top');
    top.append(el('div', 'icon', `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[p.icon]}</svg>`));
    const t = el('div'); t.append(text('h3', '', p.name), text('p', 'note', p.note)); top.append(t);
    const row = el('div', 'row'); row.append(openBtn(href, 'Open', true), copyBtn(href, 'Copy link'));
    card.append(top, text('div', 'url', href.replace('https://', '')), row);
    product.append(card);
  }

  const adsets = document.getElementById('adsets');
  for (const s of ADSETS) {
    const box = el('div', 'adset');
    const head = el('div', 'sec-head');
    const h = el('h2'); h.append(document.createTextNode(s.name), text('span', 'tag', s.kind));
    const filled = s.ads.filter(a => a.url).length;
    head.append(h, text('span', 'count', `${filled} of ${s.ads.length} linked`));
    const grid = el('div', 'ads');
    for (const a of s.ads) {
      const card = el('div', 'ad');
      const row = el('div', 'row');
      const open = openBtn(a.url || '#', 'Open', true), copy = copyBtn(a.url || '');
      if (!a.url) { open.setAttribute('aria-disabled', 'true'); open.removeAttribute('href'); copy.disabled = true; }
      row.append(open, copy);
      card.append(text('div', 'name', a.name), text('div', 'url' + (a.url ? '' : ' empty'), a.url ? a.url.replace('https://', '') : 'Meta ad link goes here'), row);
      grid.append(card);
    }
    box.append(head, grid);
    adsets.append(box);
  }
</script>
</body>
</html>
